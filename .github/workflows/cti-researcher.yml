name: CTI Researcher

on:
  workflow_dispatch:
    inputs:
      actor:
        description: "Threat actor name"
        required: true
        default: "APT28"

jobs:
  research:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r agentic-cti-researcher/requirements.txt

      - name: Run CTI Researcher
        env:
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
        run: |
          cd agentic-cti-researcher
          python main.py --actor "${{ inputs.actor }}"
